  ros2_webots_nvidia:
    build:
      context: .
      dockerfile: Dockerfile.humble
    image: ros2_webots:humble
    container_name: ros2_amcl_tutorial
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/dri:/dev/dri
      - ../:/home/user/ros2_ws/src/ros2_amcl_tutorial
    environment:
      - color_prompt=no
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    network_mode: host
    tty: true
    stdin_open: true
    runtime: nvidia